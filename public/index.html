<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabDoc</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 1.5rem;
      }
      .toolbar {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .editor-shell {
        position: relative;
        max-width: 900px;
      }
      #editor {
        box-sizing: border-box;
        width: 100%;
        height: 420px;
        padding: 12px;
        resize: vertical;
        font: 14px/1.45 "Courier New", monospace;
      }
      #cursor-layer {
        pointer-events: none;
        position: absolute;
        inset: 0;
      }
      .remote-cursor {
        position: absolute;
        border-left: 2px solid;
      }
      .remote-cursor-label {
        position: absolute;
        top: -18px;
        left: -1px;
        color: #fff;
        font-size: 11px;
        border-radius: 4px;
        padding: 1px 4px;
        white-space: nowrap;
      }
      #presence {
        margin-top: 0.75rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>CollabDoc</h1>
    <div class="toolbar">
      <label>Document <input id="doc-id" value="shared-doc" /></label>
      <label>Name <input id="name" /></label>
      <button id="join" type="button">Join</button>
      <span id="status">disconnected</span>
    </div>
    <div class="editor-shell">
      <textarea id="editor" spellcheck="false" placeholder="Start collaborating..."></textarea>
      <div id="cursor-layer"></div>
    </div>
    <div id="presence"></div>
    <script src="/client.js"></script>
  </body>
</html>
